let AC=null,muted=false,noiseBuf=null;
function unlockAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);}if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,wv,f2,vol,delay){if(muted||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(delay||0);o.type=wv;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+0.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.03);}catch(e){}}
function noise(d,vol,freq){if(muted||!AC||!noiseBuf)return;try{const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||800;const g=AC.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+d);}catch(e){}}

 drop:()=>tone(420,.08,'sine',300,.05),

 perfect:c=>{const s=SCALE[Math.min(c-1,SCALE.length-1)];const f=440*Math.pow(2,s/12);tone(f,.22,'triangle',null,.12);tone(f*2,.18,'sine',null,.05,.03);tone(90,.14,'sine',55,.2);},
 miss:()=>{tone(300,.6,'sawtooth',60,.08);noise(.4,.2,400);},
 coin:()=>{tone(988,.08,'square',null,.05);tone(1319,.14,'square',null,.05,.07);},

function startGame(){
 const ty=typeOf(save.sel);const fw=Math.round(ty.fw*wideMul());
 G={ty,fw,w:fw,floors:[],lives:maxLives(),combo:0,maxCombo:0,perf:0,res:0,bonus:0,t:0,swingT:rnd(0,100),block:null,wait:30,end:0,hint:220,debris:[],zone:0,squash:0,ring:null};
 camY=0;pops=[];parts=[];props=[];misPaid=0;phase='play';showUI('none');
}
function pivotX(){const n=G.floors.length;return W/2+Math.sin(G.t*0.009)*Math.min(W*0.115,n*1.6)*G.ty.spd;}
function hangPos(){const n=G.floors.length;const amp=0.48+Math.min(0.25,n*0.004);const w=0.034*G.ty.spd*swingMul()*(1+Math.min(1.1,n*0.014)*(1-0.1*lvOf('hcrane')));const th=amp*Math.sin(G.swingT*w);const thd=amp*w*Math.cos(G.swingT*w);const px=pivotX();
 return{x:px+Math.sin(th)*ROPE,y:JIBY+30+Math.cos(th)*ROPE+BH/2,th,vx:ROPE*thd*Math.cos(th)*0.6,px};}
function drop(){if(phase!=='play'||!G.block||G.block.st!=='hang')return;const h=hangPos();Object.assign(G.block,{st:'fall',x:h.x,y:h.y+camY,vx:h.vx,vy:0});G.hint=0;sfx.drop();}
const topY=()=>GROUND-G.floors.length*BH;
function stepGame(){
 G.t++;if(G.squash>0)G.squash--;if(flashT>0)flashT--;
 if(G.end){G.end++;if(G.end>120)finish();}
 if(!G.block&&!G.end){G.wait--;if(G.wait<=0)G.block={st:'hang',x:0,y:0,vx:0,vy:0,rot:0,vr:0,w:G.w};}
 const b=G.block;
 if(b&&b.st==='hang')G.swingT++;
 else if(b){
  b.vy+=0.6;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;
  if(b.st==='fall'&&b.y+BH/2>=topY())land(b);
  if(b.st==='miss'&&b.y-camY>H+140){G.block=null;G.wait=30;}
 }
 for(const d of G.debris){d.vy+=0.5;d.x+=d.vx;d.y+=d.vy;d.rot+=d.vr;if(d.y>GROUND-8&&!d.hit){d.hit=true;dust(d.x,GROUND,10);d.vy*=-0.3;d.vx*=0.5;}}
 G.debris=G.debris.filter(d=>d.y-camY<H+150&&d.y<GROUND+60);
 if(G.ring){G.ring.t++;if(G.ring.t>30)G.ring=null;}
 const target=portrait?Math.min(GROUND-H*0.86,topY()-H*0.64):Math.min(0,topY()-H*0.66);camY+=(target-camY)*0.08;
 if(G.hint>0)G.hint--;
 // zonas y decorado
 const z=zoneOf(G.floors.length);if(z>G.zone){G.zone=z;sfx.zone();toast(T().zone+': '+T().zones[z]);}
 spawnProps();
 for(const p of props){p.x+=p.vx;p.y+=p.vy||0;p.t=(p.t||0)+1;}props=props.filter(p=>p.x>-300&&p.x<W+300&&p.t<3000);
}
function land(b){
 const n=G.floors.length;const top=n?G.floors[n-1]:{x:W/2,w:G.w+70};
 const L=Math.max(b.x-b.w/2,top.x-top.w/2),R=Math.min(b.x+b.w/2,top.x+top.w/2);const dx=b.x-top.x;
 if(R-L<3){b.st='miss';b.vr=Math.sign(dx||1)*0.05;b.vx=Math.sign(dx||1)*2;G.lives--;G.combo=0;sfx.miss();buzz(60);shake=12;
  pop(T().miss,b.x,topY()-60,'#e63946',30);if(G.lives<=0)G.end=1;return;}
 let x,w,r;
 let perfect=n>0?Math.abs(dx)<=tol():Math.abs(dx)<=tol()+6,fixed=false;
 if(!perfect&&n>0&&Math.random()<0.04*lvOf('fix')){perfect=true;fixed=true;}
 if(perfect){
  x=n?top.x:W/2;w=b.w;G.combo++;G.perf++;G.maxCombo=Math.max(G.maxCombo,G.combo);r=3+(G.combo>=3?1:0);
  sfx.perfect(G.combo);buzz(12);G.ring={x,y:topY()-BH,w,t:0};flashT=6;sparkle(x,topY(),w);
  pop(fixed?T().fixed:T().perfect,x,topY()-62,fixed?'#5ad19a':'#FFC425',30);
  if(G.combo>=4-lvOf('streak')&&G.w<G.fw){G.w=Math.min(G.fw,G.w+10+4*lvOf('streak'));w=G.w;pop(T().grow,x,topY()-96,'#5ad19a',22);}
  misProgress('streak',G.combo,true);
 }else if(n===0){x=b.x;w=b.w;G.combo=0;r=2;sfx.land();}
 else{
  x=(L+R)/2;w=R-L;G.combo=0;r=Math.max(1,Math.round(3*w/G.fw));sfx.cut();buzz(25);shake=4;
  const cL=dx>0?R:b.x-b.w/2,cR=dx>0?b.x+b.w/2:L;
  G.debris.push({x:(cL+cR)/2,y:b.y,w:cR-cL,vx:Math.sign(dx)*1.6,vy:-1.5,rot:0,vr:Math.sign(dx)*0.05,i:n});
  G.w=w;sfx.land();
 }
 G.floors.push({x,w,r});G.res+=r;G.squash=10;dust(x-w/2,topY()+BH,4);dust(x+w/2,topY()+BH,4);
 const m=G.floors.length;
 misProgress('floors',m,true);misProgress('perf',G.perf,true);misProgress('res',G.res,true);
 if(m%10===0){const bo=Math.round(10*(m/10)*G.ty.mult*rentMul()*(1+m/50));G.bonus+=bo;sfx.mile();pop(T().milestone.replace('{n}',m)+'  +'+money(bo),W/2,topY()-140,'#5ad19a',26);confetti(topY()-80,24);}
 G.block=null;G.wait=16;
}

function showMissions(){
 const t=T();let h=`<div class="sh"><span>${t.missions}</span></div><div class="stripe"></div><div class="sb">`;
 for(const m of save.mis){const p=Math.min(1,m.prog/m.n);h+=`<div class="mis"><div class="txt">${misText(m)}<div class="bar"><i style="width:${p*100}%"></i></div></div><div class="rew"><i class="coin" style="display:inline-block;vertical-align:-.15em"></i> ${money(m.reward)}</div></div>`;}
 h+=`<div class="row"><button class="btn" data-a="menu">${t.back}</button><button class="btn play" data-a="play" style="font-size:1.1em">${t.play}</button></div></div>`;
 openSheet(h,false,startGame);
}
function showResult(n,earn,rec){
 const t=T();const tot=earn+G.bonus+misPaid;
 openSheet(`<div class="sh"><span>${t.receipt}</span></div><div class="stripe"></div><div class="sb receipt">
 <div class="big">${n}</div><div class="sub">${t.floorsU.toUpperCase()} · ${t.types[G.ty.id]} ${rec&&n>0?'<span class="badge">'+t.newRec+'</span>':''}</div>
 <div class="kv"><span>${t.pf}</span><b>${G.perf}</b></div><div class="kv"><span>${t.bestStreak}</span><b>${G.maxCombo}</b></div><div class="kv"><span>${t.residents}</span><b>${G.res}</b></div>
 <div class="kv"><span>${t.earn}</span><b>${money(earn)}</b></div>${G.bonus?`<div class="kv"><span>${t.bonus}</span><b>${money(G.bonus)}</b></div>`:''}${misPaid?`<div class="kv"><span>${t.misPay}</span><b>${money(misPaid)}</b></div>`:''}
 <div class="kv" style="font-size:1.15em;border-top:.15em solid #23262B;margin-top:.3em;padding-top:.3em"><span>${t.total}</span><b>${money(tot)}</b></div>
 <div id="rankBox">${rankBoxHtml()}</div>
 <div class="row" style="margin-top:.9em"><button class="btn play" data-a="play" style="flex:1;font-size:1.2em">${t.again}</button></div>
 <div class="row"><button class="btn" data-a="shop" style="flex:1">${t.shop}</button><button class="btn" data-a="rank" style="flex:1">${t.rank}</button><button class="btn" data-a="menu" style="flex:1">${t.toCity}</button></div></div>`,true,startGame);
 cleanMissions();if(lastRun&&save.user)sendRun();
}
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;unlockAudio();const a=b.dataset.a,id=b.dataset.id;
 if(a!=='reset')resetArm=false;
 if(a==='play')startGame();else if(a==='shop')showShop();else if(a==='menu')showMenu();else if(a==='mis')showMissions();else if(a==='rank')showRanking();else if(a==='rtab')showRanking(id);else if(a==='visit')showVisit(id);
 else if(a==='login')showLogin('new');else if(a==='lmode')showLogin(id);else if(a==='doreg')doAuth(true);else if(a==='dolog')doAuth(false);else if(a==='logout')logout();else if(a==='offline')showMenu();
/*nick*/ else if(a==='__nick'){const v=(document.getElementById('nickIn')||{}).value||'';if(!nickOk(v)){const er=document.getElementById('nickErr');if(er)er.textContent=T().nickBad;return;}save.nick=v.trim();persist();if(lastRun){refreshRankBox();sendRun();}else showRanking();}
 else if(a==='sel'){save.sel=id;persist();showMenu();}
 else if(a==='up'){const u=UPG.find(x=>x.id===id);const c=upCost(u);if(save.wallet>=c&&lvOf(id)<u.max&&!(u.req&&save.best<u.req)){save.wallet-=c;save.lv[id]=lvOf(id)+1;persist();markDirty();sfx.coin();}showShop();}
 else if(a==='type'){const ty=typeOf(id);if(save.wallet>=ty.cost){save.wallet-=ty.cost;save.types[id]=true;save.sel=id;persist();markDirty();sfx.coin();}showShop();}
 else if(a==='reset'){if(resetArm){save=blank();fillMissions();persist();resetArm=false;}else resetArm=true;showShop();}
});
setInterval(()=>{persist();},5000);
cv.addEventListener('pointerdown',()=>{unlockAudio();drop();});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Enter'){const b=document.querySelector('[data-a=doreg],[data-a=dolog]');if(b)b.click();}return;}if(e.code==='Space'||e.code==='Enter'){e.preventDefault();unlockAudio();if(phase==='play')drop();else if(enterAct&&!e.repeat)enterAct();}});
const bLang=document.getElementById('bLang'),bMute=document.getElementById('bMute'),rot=document.getElementById('rot');
function applyLang(){bLang.textContent=lang==='es'?'EN':'ES';bMute.textContent=muted?T().mute:T().sound;document.documentElement.lang=lang;document.title=lang==='es'?'Torres al Toque':'Quick Towers';rot.textContent=T().rotate;try{localStorage.setItem('tt_lang',lang);}catch(e){}}
bLang.addEventListener('click',e=>{e.stopPropagation();lang=lang==='es'?'en':'es';applyLang();bLang.blur();if(phase==='menu'){if(!sheetWrap.classList.contains('hide')&&sheet.querySelector('[data-a=up]'))showShop();else showMenu();}});
bMute.addEventListener('click',e=>{e.stopPropagation();muted=!muted;applyLang();bMute.blur();});
applyLang();

function step(){frame++;shake*=0.85;
 if(phase==='play')stepGame();
 for(const p of parts){p.life--;p.vy+=p.g||0;p.x+=p.vx;p.y+=p.vy;if(p.grow)p.r+=p.grow;}parts=parts.filter(p=>p.life>0);if(parts.length>400)parts.splice(0,parts.length-400);
 for(const p of pops){p.life--;p.s++;p.y-=0.7;}pops=pops.filter(p=>p.life>0);
}
ready=true;if(SB_URL&&!save.user)showLogin(save.nick||save.city.length?'new':'new');else showMenu();

let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__game={get camY(){return camY},get phase(){return phase},get G(){return G},hangPos,drop,step,startGame,save:()=>save,showShop,showMenu,showMissions,topY};
}
</script>

if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
